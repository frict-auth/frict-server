version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /e2e
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - goauthentik/*
    groups:
      authentik:
        patterns:
          - goauthentik/*
  - package-ecosystem: docker
    directories:
      - /e2e
      - /e2e/sssd
      - /e2e/zbar
    exclude-paths:
      - compose.yaml
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns:
          - "*"
      gomod-security:
        applies-to: security-updates
        patterns:
          - "*"
