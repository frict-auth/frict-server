version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /e2e
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - goauthentik/*
    groups:
      authentik:
        patterns:
          - goauthentik/*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
