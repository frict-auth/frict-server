name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: |
          go vet ./...
          go vet -tags e2e ./...
          go vet -tags fcmlive ./...
      - name: go test -race
        run: go test -race -count=1 -v ./...

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Authentik + frict-server + fake phone + LDAP outpost + SSSD e2e (answer delay 60s, push expiry 90s)
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/e2e-logs
          FRICT_E2E_ANSWER_DELAY: 60s
          FRICT_CHALLENGE_TTL: 90s
        run: e2e/run.sh
      - name: Upload container and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs
          if-no-files-found: error

  fcm-live:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/722552623873/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: frict-fcm-ci@dev-frict-auth.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
      - name: validate_only send through FCM HTTP v1
        env:
          FCM_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FCM_PROJECT_ID: dev-frict-auth
        run: go test -tags fcmlive -run '^TestFCMLive$' -count=1 -v ./internal/push
