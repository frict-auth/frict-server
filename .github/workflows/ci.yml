name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Weekly scan of main between Dependabot's monthly runs: unit (go mod verify, govulncheck) and codeql only.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: |
          go vet ./...
          go vet -tags e2e ./...
          go vet -tags fcmlive ./...
          go vet -tags deploy ./...
      - name: actionlint and shellcheck
        run: |
          lint() { docker run --rm --volume "$PWD:/repo:ro" --workdir /repo "$@"; }
          image=docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          lint "$image" -color
          mapfile -t scripts < <(git ls-files '*.sh' deploy/frict-deploy)
          lint --entrypoint shellcheck "$image" "${scripts[@]}"
      - name: go test -race
        run: go test -race -count=1 -v ./...
      - name: Build, publish and deploy against a local registry and box
        run: go test -tags deploy -count=1 -v ./deploy/test
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  e2e:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Authentik + frict-server + fake phone + LDAP outpost + SSSD e2e (answer delay 60s, push expiry 90s)
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/e2e-logs
          FRICT_E2E_ANSWER_DELAY: 60s
          FRICT_CHALLENGE_TTL: 90s
        run: e2e/run.sh
      - name: Upload container and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs
          if-no-files-found: error

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go
          build-mode: autobuild
          config-file: .github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-sarif
      - name: Fail on any CodeQL finding
        env:
          SARIF_DIR: ${{ runner.temp }}/codeql-sarif
        run: |
          findings="$(jq -r '
            .runs[]
            | ([.tool.driver.rules[]?, .tool.extensions[]?.rules[]?] | map({key: .id, value: .}) | from_entries) as $rules
            | .results[]
            | $rules[.ruleId] as $r
            | .locations[0].physicalLocation as $loc
            | "\(.ruleId) [\(.level // $r.defaultConfiguration.level // "warning")\(if $r.properties["security-severity"] then ", security-severity \($r.properties["security-severity"])" else "" end)] \($loc.artifactLocation.uri):\($loc.region.startLine): \(.message.text)"
          ' "$SARIF_DIR"/*.sarif)"
          if [ -n "$findings" ]; then
            echo "CodeQL findings:"; echo "$findings"; exit 1
          fi
          echo "CodeQL: 0 findings"

  fcm-live:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/722552623873/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: frict-fcm-ci@dev-frict-auth.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
      - name: validate_only send through FCM HTTP v1
        env:
          FCM_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FCM_PROJECT_ID: dev-frict-auth
        run: go test -tags fcmlive -run '^TestFCMLive$' -count=1 -v ./internal/push
