# TLS in front of frict-server, as in production: duo_client only dials 443
# and checks the certificate against the mounted test CA.
server {
    listen 443 ssl;
    server_name frict.frict.test;
    ssl_certificate     /secrets/frict.pem;
    ssl_certificate_key /secrets/frict.key;

    location / {
        proxy_pass http://frict-server:8080;
        proxy_read_timeout 300s;
    }
}
