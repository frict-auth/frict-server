name: frict-m0

x-authentik: &authentik
  image: ghcr.io/goauthentik/server:2026.8.7@sha256:1675a017c46ba7f4f15333aeafeeb64538c581673bcbcd36af872cdf7de4e7f7
  env_file: secrets/authentik.env
  environment:
    AUTHENTIK_POSTGRESQL__HOST: postgresql
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__USER: authentik
    AUTHENTIK_LOG_LEVEL: info
  volumes:
    - ./secrets/ca.pem:/ak-root/.venv/lib/python3.14/site-packages/duo_client/ca_certs.pem:ro
  shm_size: 512mb
  depends_on:
    postgresql:
      condition: service_healthy
    frict-tls:
      condition: service_started

services:
  postgresql:
    image: docker.io/library/postgres:18.6-alpine
    env_file: secrets/authentik.env
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 2s
      retries: 30

  server:
    <<: *authentik
    command: server
    ports:
      - 127.0.0.1:9000:9000
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 300s
      start_interval: 3s

  worker:
    <<: *authentik
    command: worker

  frict-server:
    build: ..
    environment:
      FRICT_API_HOSTNAME: frict.frict.test
      FRICT_CLIENT_ID: DIFRICTE2E0000000000
      FRICT_CLIENT_SECRET_FILE: /secrets/duo-client-secret
      FRICT_DB_PATH: /data/frict.db
      FRICT_CHALLENGE_TTL: ${FRICT_CHALLENGE_TTL:-85s}
      # fakephone.AppVersion, so fake phones are current unless a test says otherwise.
      FRICT_MIN_APP_VERSION: "1000"
      # The fake phone's chains: debug build, test root.
      FRICT_ATTESTATION: emulator
      FRICT_APP_PACKAGES: app.frict.android.dev
      FRICT_APP_SIGNING_CERTS: 21:6D:CF:50:A3:00:A0:40:6A:2C:A0:14:84:D2:99:70:1C:70:BF:FA:3C:2C:66:6C:6C:60:44:3C:F1:E8:59:BB
    tmpfs:
      - /data:uid=65532,gid=65532,mode=0700
    volumes:
      - ./secrets:/secrets:ro

  frict-tls:
    image: docker.io/library/nginx:1.31.9-alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7
    depends_on:
      frict-server:
        condition: service_started
    ports:
      - 127.0.0.1:8443:443
    volumes:
      - ./secrets:/secrets:ro
      - ./frict-tls.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases:
          - frict.frict.test

  # Started by the e2e test once it has provisioned the outpost and can pass
  # its token in FRICT_LDAP_OUTPOST_TOKEN.
  ldap:
    image: ghcr.io/goauthentik/ldap:2026.8.7@sha256:b0400c194cd8f4b7b98b2685926cd7c5d79c036d2ca2d6ec61fff3138c90096e
    environment:
      AUTHENTIK_HOST: http://server:9000
      AUTHENTIK_TOKEN: ${FRICT_LDAP_OUTPOST_TOKEN:-}
    networks:
      default:
        aliases:
          - ldap.frict.test

  # SSSD clients, started by the e2e test after the outpost: one with SSSD's
  # default timeouts, one with the tuned reference config.
  sssd-default:
    build: sssd
    image: frict-m0-sssd
    volumes:
      - ./secrets:/secrets:ro
      - ./sssd/sssd-defaults.conf:/frict/sssd.conf:ro

  sssd-tuned:
    image: frict-m0-sssd
    pull_policy: never
    volumes:
      - ./secrets:/secrets:ro
      - ./sssd/sssd.conf:/frict/sssd.conf:ro

  # Run by the enrollment test: reads a PNG on stdin and prints the QR code's
  # contents.
  zbar:
    build: zbar
    image: frict-m0-zbar
