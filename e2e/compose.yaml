name: frict-m0

x-authentik: &authentik
  image: ghcr.io/goauthentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
  env_file: secrets/authentik.env
  environment:
    AUTHENTIK_POSTGRESQL__HOST: postgresql
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__USER: authentik
    AUTHENTIK_LOG_LEVEL: info
  volumes:
    - ./secrets/ca.pem:/ak-root/.venv/lib/python3.14/site-packages/duo_client/ca_certs.pem:ro
  shm_size: 512mb
  depends_on:
    postgresql:
      condition: service_healthy
    frict-tls:
      condition: service_started

services:
  postgresql:
    image: docker.io/library/postgres:16.15-alpine
    env_file: secrets/authentik.env
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 2s
      retries: 30

  server:
    <<: *authentik
    command: server
    ports:
      - 127.0.0.1:9000:9000
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 300s
      start_interval: 3s

  worker:
    <<: *authentik
    command: worker

  frict-server:
    build:
      context: ..
      dockerfile: e2e/frict-server.Dockerfile
    environment:
      FRICT_API_HOSTNAME: frict.frict.test
      FRICT_CLIENT_ID: DIFRICTE2E0000000000
      FRICT_CLIENT_SECRET_FILE: /secrets/duo-client-secret
      FRICT_DB_PATH: /data/frict.db
      FRICT_CHALLENGE_TTL: ${FRICT_CHALLENGE_TTL:-90s}
    tmpfs:
      - /data:uid=65532,gid=65532,mode=0700
    volumes:
      - ./secrets:/secrets:ro

  frict-tls:
    image: docker.io/library/nginx:1.29.3-alpine@sha256:b3c656d55d7ad751196f21b7fd2e8d4da9cb430e32f646adcf92441b72f82b14
    depends_on:
      frict-server:
        condition: service_started
    ports:
      - 127.0.0.1:8443:443
    volumes:
      - ./secrets:/secrets:ro
      - ./frict-tls.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases:
          - frict.frict.test

  # Started by the e2e test once it has provisioned the outpost and can pass
  # its token in FRICT_LDAP_OUTPOST_TOKEN.
  ldap:
    image: ghcr.io/goauthentik/ldap:2026.8.5@sha256:4c75bd27918418d2d6fbbfe4581bbd5a199fe38942d24559c4483edd64a1ea87
    environment:
      AUTHENTIK_HOST: http://server:9000
      AUTHENTIK_INSECURE: "true"
      AUTHENTIK_TOKEN: ${FRICT_LDAP_OUTPOST_TOKEN:-}
    networks:
      default:
        aliases:
          - ldap.frict.test

  # SSSD clients, started by the e2e test after the outpost: one with SSSD's
  # default timeouts, one with the tuned reference config.
  sssd-default:
    build: sssd
    image: frict-m0-sssd
    volumes:
      - ./secrets:/secrets:ro
      - ./sssd/sssd-defaults.conf:/frict/sssd.conf:ro

  sssd-tuned:
    image: frict-m0-sssd
    pull_policy: never
    volumes:
      - ./secrets:/secrets:ro
      - ./sssd/sssd.conf:/frict/sssd.conf:ro

  # Run by the enrollment test: reads a PNG on stdin and prints the QR code's
  # contents.
  zbar:
    build: zbar
    image: frict-m0-zbar
