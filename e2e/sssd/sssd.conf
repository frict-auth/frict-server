# Reference SSSD config for logging in through the Authentik LDAP outpost
# with a Duo push (Frict) in the bind flow: sssd-defaults.conf plus the
# settings below the marker. Measured in e2e; see docs/m0-findings.md (e).
[sssd]
services = nss, pam
domains = frict

[domain/frict]
id_provider = ldap
auth_provider = ldap
access_provider = permit
chpass_provider = none
cache_credentials = false
ldap_uri = ldaps://ldap.frict.test:6636
ldap_tls_reqcert = demand
ldap_tls_cacert = /secrets/ca.pem
ldap_schema = rfc2307bis
ldap_search_base = dc=frict,dc=test
ldap_user_search_base = ou=users,dc=frict,dc=test
ldap_group_search_base = ou=groups,dc=frict,dc=test
ldap_user_object_class = user
ldap_user_name = cn
ldap_group_object_class = group
ldap_group_name = cn
ldap_default_bind_dn = cn=ldap-svc,ou=users,dc=frict,dc=test

# --- push timeouts ---
# The user's simple bind waits for the push. At the default (8 s) SSSD times
# the bind out, reconnects and binds again, sending a new push each time.
# Keep this above the push expiry.
ldap_opt_timeout = 90
